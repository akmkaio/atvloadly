name: Build and publish Home Assistant add-on image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - "update/**"
    paths:
      - "atvloadly/**"
      - ".github/workflows/build-ha-addon.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ha-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read add-on version and validate changelog
        id: addon
        shell: bash
        run: |
          VERSION="$(awk -F '"' '/^version:/ { print $2; exit }' atvloadly/config.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from atvloadly/config.yaml" >&2
            exit 1
          fi

          if [ ! -f atvloadly/CHANGELOG.md ]; then
            echo "Missing atvloadly/CHANGELOG.md" >&2
            exit 1
          fi

          if ! grep -Eq "^##[[:space:]]+${VERSION}([[:space:]]|$)" atvloadly/CHANGELOG.md; then
            echo "Missing changelog entry for add-on version ${VERSION}" >&2
            echo "Add a heading such as: ## ${VERSION} - YYYY-MM-DD" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/akmkaio/atvloadly-ha:$VERSION"
            if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "ghcr.io/akmkaio/atvloadly-ha:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building atvloadly HA add-on version $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: atvloadly
          file: atvloadly/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.addon.outputs.tags }}
          labels: |
            org.opencontainers.image.title=atvloadly Home Assistant add-on
            org.opencontainers.image.source=https://github.com/akmkaio/atvloadly
            org.opencontainers.image.licenses=AGPL-3.0
